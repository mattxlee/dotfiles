setw -g mode-keys vi
set-option -sg escape-time 200

set -g default-terminal 'tmux-256color'
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'

# ---------------------------------------------------------------------------
# Clipboard (OSC 52) — Linux / macOS / remote SSH
# ---------------------------------------------------------------------------
# 上面的配置不依赖 wl-copy/pbcopy，而是用 OSC 52 让 tmux 把选中的文本
# 经终端写入系统剪贴板，因此本地和 SSH 到远端都通用。
#
# macOS 兼容性：
#   - 需要终端本身支持 OSC 52：
#       iTerm2      : 支持，但要在 Preferences > General > Selection 里
#                     勾选 "Applications in terminal may access clipboard"。
#       kitty       : 支持，默认开启（本仓库 kitty.conf 已设 clipboard_control）。
#       Alacritty   : 支持。
#       WezTerm     : 支持。
#       Ghostty     : 支持。
#       Terminal.app: 不支持 OSC 52，复制不会进系统剪贴板。
#   - `terminal-features` 需要 tmux >= 3.2（Homebrew 安装的 tmux 满足）。
#     若远端/旧版 tmux 更老，改用下面这行替代 `terminal-features`：
#       # set -as terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'
#   - macOS 上不能用 wl-copy（Linux 专属）；pbcopy/pbpaste 只在本地有效，
#     SSH 场景下写入的是远端剪贴板，所以不采用。
# ---------------------------------------------------------------------------
set -g set-clipboard on
set -as terminal-features ',*:clipboard'
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode y send-keys -X copy-selection-and-cancel
